# Rebuilds broadcastbrowser.com when a release is published, so its download buttons link to the
# new version. PAGES_DEPLOY_HOOK: the Cloudflare Pages project's deploy hook (Settings → Builds →
# Deploy hooks), stored as a repository secret.
name: Rebuild broadcastbrowser.com

on:
  release:
    types: [published]

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start a Cloudflare Pages build
        run: curl -fsS -X POST "$HOOK" > /dev/null
        env:
          HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
