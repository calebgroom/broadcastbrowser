<svg xmlns="http://www.w3.org/2000/svg" width="540" height="380" viewBox="0 0 540 380" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- The installer window's background (540×380: electron-builder.yml's dmg window). Finder puts
       the app's icon at (140, 180) and Applications at (400, 180), with their names below them.
       Rendered to dmg-background.png and @2x by scripts/icons.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#e7eaf1"/>
    </linearGradient>
  </defs>
  <rect width="540" height="380" fill="url(#bg)"/>
  <text x="270" y="58" text-anchor="middle" font-family="Inter, -apple-system, Helvetica Neue, sans-serif" font-size="22" font-weight="700" fill="#1b2340">Broadcast Browser</text>
  <!-- The arrow, from the app to Applications. -->
  <g fill="none" stroke="#8a93ab" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 222 180 L 314 180"/>
    <path d="M 298 164 L 316 180 L 298 196"/>
  </g>
  <text x="270" y="330" text-anchor="middle" font-family="Inter, -apple-system, Helvetica Neue, sans-serif" font-size="14" fill="#5b6378">Drag Broadcast Browser into Applications to install it.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
