<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Broadcast Browser's app icon: a browser window with a broadcast signal in it, on the macOS
       icon grid (an 824-px rounded square in a 1024-px canvas, with its shadow). Rendered to
       icon.png by scripts/icons.mjs; electron-builder makes the .icns from that. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#0f1530"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2233"/>
      <stop offset="1" stop-color="#0b0e16"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#d9dee9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4b4b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- The body. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#body)">
    <!-- A soft light from the top. -->
    <rect x="100" y="100" width="824" height="824" fill="url(#light)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- The browser window. -->
  <g filter="url(#cardShadow)">
    <rect x="184" y="288" width="656" height="450" rx="40" fill="url(#card)"/>
  </g>
  <circle cx="232" cy="330" r="13" fill="#ff5f57"/>
  <circle cx="272" cy="330" r="13" fill="#febc2e"/>
  <circle cx="312" cy="330" r="13" fill="#28c840"/>
  <rect x="352" y="315" width="430" height="30" rx="15" fill="#c3cad8"/>
  <!-- Its page: 16:9. -->
  <rect x="208" y="372" width="608" height="342" rx="18" fill="url(#screen)"/>

  <!-- The broadcast signal. -->
  <circle cx="512" cy="543" r="150" fill="url(#glow)"/>
  <circle cx="512" cy="543" r="50" fill="#ff3b3b"/>
  <g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round">
    <path d="M 434.0 480.5 A 100 100 0 0 0 434.0 605.5"/>
    <path d="M 590.0 480.5 A 100 100 0 0 1 590.0 605.5"/>
    <path d="M 390.3 445.5 A 156 156 0 0 0 390.3 640.5" opacity="0.6"/>
    <path d="M 633.7 445.5 A 156 156 0 0 1 633.7 640.5" opacity="0.6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
